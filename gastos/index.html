<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gastos</title>
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Controle simples de gastos com etanol e gastos do dia." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --panel2:#182235;
      --line:#2b3952;
      --txt:#f8fafc;
      --muted:#9fb0ca;
      --ok:#3ddc84;
      --warn:#fbbf24;
      --danger:#fb7185;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:linear-gradient(180deg,#0b1220,#111827);color:var(--txt);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    .app{max-width:740px;margin:0 auto;padding:16px 14px 90px}
    .top,.card{
      background:linear-gradient(180deg,var(--panel),var(--panel2));
      border:1px solid var(--line);
      border-radius:20px;
      padding:16px;
      box-shadow:0 12px 30px rgba(0,0,0,.22);
    }
    .top{margin-bottom:14px}
    h1{margin:0 0 6px;font-size:30px;line-height:1.1}
    .sub{color:var(--muted);font-size:18px;margin-bottom:12px}
    .stats{display:grid;grid-template-columns:1fr;gap:10px}
    .stat{
      background:#0a1020;
      border:1px solid #23324a;
      border-radius:16px;
      padding:14px;
    }
    .stat-label{color:var(--muted);font-size:16px;margin-bottom:5px}
    .stat-value{font-size:34px;font-weight:700;color:var(--warn);word-break:break-word}
    .stat-value.small{font-size:26px;color:var(--ok)}
    .install-box{
      margin-top:12px;
      display:none;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      background:#0a1020;
      border:1px dashed #40608d;
      border-radius:16px;
      padding:12px;
    }
    .install-box span{font-size:16px;color:#d5def0}
    .card{margin-bottom:14px}
    .grid{display:grid;gap:12px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;font-size:18px;font-weight:700;margin-bottom:6px}
    input,select{
      width:100%;
      padding:15px 14px;
      border-radius:12px;
      border:1px solid #344867;
      background:#091120;
      color:#fff;
      font-size:21px;
      outline:none;
    }
    button{
      width:100%;
      border:none;
      border-radius:14px;
      padding:15px 14px;
      font-size:20px;
      font-weight:700;
      cursor:pointer;
    }
    .btn-add{background:var(--ok);color:#06130d}
    .btn-export{background:#243550;color:#fff;border:1px solid #3d5a87}
    .btn-clear{background:#34171f;color:#ffd7de;border:1px solid #7d3443}
    .btn-install{background:#1d4ed8;color:#fff;border:1px solid #5d89ff;width:auto;padding:12px 14px}
    .btn-del{
      width:auto;padding:9px 11px;border-radius:10px;
      background:#36151d;color:#ffb8c3;border:1px solid #7d3443;font-size:15px
    }
    .dia{border-top:1px solid #28344c;padding-top:12px;margin-top:12px}
    .dia:first-child{border-top:none;padding-top:0;margin-top:0}
    .dia-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .dia-titulo{font-size:24px;font-weight:700}
    .dia-sub{font-size:21px;font-weight:700;color:var(--warn)}
    .item{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      background:#091120;border:1px solid #22324c;border-radius:14px;padding:12px;margin-bottom:8px
    }
    .item-left{min-width:0}
    .item-cat{font-size:20px;font-weight:700;margin-bottom:4px}
    .item-desc,.item-hora{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
    .item-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .item-valor{font-size:22px;font-weight:700;color:var(--ok)}
    .vazio{text-align:center;color:var(--muted);font-size:20px;padding:10px 0}
    .hint{color:var(--muted);font-size:15px;margin-top:8px}
    @media (max-width:430px){
      h1{font-size:27px}
      .stat-value{font-size:30px}
      input,select,button{font-size:19px}
      .row2{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1>Bem-Vindo Nei</h1>
      <h1>Controle de Gastos</h1>
      <div class="sub">PWA instalável no celular e no PC</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Total acumulado</div>
          <div class="stat-value" id="totalGeral">R$ 0,00</div>
        </div>
        <div class="stat">
          <div class="stat-label">Gasto do dia</div>
          <div class="stat-value small" id="totalDia">R$ 0,00</div>
        </div>
      </div>

      <div class="install-box" id="installBox">
        <span>Toque aqui para instalar o app na tela inicial.</span>
        <button class="btn-install" id="btnInstall">Instalar app</button>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label for="data">Data</label>
          <input id="data" type="date" />
        </div>

        <div class="row2">
          <div>
            <label for="categoria">Tipo</label>
            <select id="categoria">
              <option>Etanol</option>
              <option>Alimentação</option>
              <option>Outros</option>
            </select>
          </div>
          <div>
            <label for="valor">Valor (R$)</label>
            <input id="valor" type="number" min="0" step="0.01" placeholder="0,00" />
          </div>
        </div>

        <div>
          <label for="descricao">Observação</label>
          <input id="descricao" type="text" placeholder="Ex.: abasteci 30 reais" />
        </div>

        <button class="btn-add" id="btnAdd">Adicionar gasto</button>
        <div class="hint">Os dados ficam salvos no navegador do aparelho.</div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <button class="btn-export" id="btnExport">Exportar CSV</button>
        <button class="btn-clear" id="btnClear">Zerar tudo</button>
      </div>
    </div>

    <div class="card">
      <div id="lista"></div>
    </div>
  </div>

  <script>
    const KEY = "controle-gastos-pwa-v1";
    const dataEl = document.getElementById("data");
    const categoriaEl = document.getElementById("categoria");
    const valorEl = document.getElementById("valor");
    const descricaoEl = document.getElementById("descricao");
    const totalGeralEl = document.getElementById("totalGeral");
    const totalDiaEl = document.getElementById("totalDia");
    const listaEl = document.getElementById("lista");
    const installBox = document.getElementById("installBox");
    const btnInstall = document.getElementById("btnInstall");

    dataEl.value = new Date().toISOString().slice(0,10);

    const brl = (v) => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const horaAtual = () => new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const hoje = () => new Date().toISOString().slice(0,10);
    const ler = () => JSON.parse(localStorage.getItem(KEY) || "[]");
    const salvar = (dados) => localStorage.setItem(KEY, JSON.stringify(dados));

    function ordenarDesc(a,b){ return b.data.localeCompare(a.data) || b.id - a.id; }

    function render(){
      const gastos = ler().sort(ordenarDesc);
      const total = gastos.reduce((s,g)=>s + Number(g.valor),0);
      const totalDia = gastos.filter(g=>g.data === hoje()).reduce((s,g)=>s + Number(g.valor),0);

      totalGeralEl.textContent = brl(total);
      totalDiaEl.textContent = brl(totalDia);

      if(!gastos.length){
        listaEl.innerHTML = '<div class="vazio">Nenhum gasto lançado ainda.</div>';
        return;
      }

      const grupos = {};
      for(const g of gastos){
        if(!grupos[g.data]) grupos[g.data] = [];
        grupos[g.data].push(g);
      }

      listaEl.innerHTML = Object.keys(grupos).sort((a,b)=>b.localeCompare(a)).map(data=>{
        const itens = grupos[data];
        const subtotal = itens.reduce((s,g)=>s + Number(g.valor),0);
        const dataFmt = new Date(data + "T00:00:00").toLocaleDateString("pt-BR");

        const htmlItens = itens.map(g=>`
          <div class="item">
            <div class="item-left">
              <div class="item-cat">${g.categoria}</div>
              <div class="item-desc">${g.descricao ? g.descricao : "Sem observação"}</div>
              <div class="item-hora">Lançado às ${g.hora}</div>
            </div>
            <div class="item-right">
              <div class="item-valor">${brl(g.valor)}</div>
              <button class="btn-del" onclick="excluir(${g.id})">Excluir</button>
            </div>
          </div>
        `).join("");

        return `
          <div class="dia">
            <div class="dia-top">
              <div class="dia-titulo">${dataFmt}</div>
              <div class="dia-sub">Dia: ${brl(subtotal)}</div>
            </div>
            ${htmlItens}
          </div>
        `;
      }).join("");
    }

    function adicionar(){
      const data = dataEl.value;
      const categoria = categoriaEl.value;
      const valor = parseFloat(valorEl.value);
      const descricao = descricaoEl.value.trim();

      if(!data){ alert("Escolha a data."); return; }
      if(!valor || valor <= 0){ alert("Digite um valor maior que zero."); return; }

      const gastos = ler();
      gastos.push({
        id: Date.now(),
        data,
        categoria,
        valor,
        descricao,
        hora: horaAtual()
      });

      salvar(gastos);
      valorEl.value = "";
      descricaoEl.value = "";
      render();
      valorEl.focus();
    }

    function excluir(id){
      salvar(ler().filter(g=>g.id !== id));
      render();
    }
    window.excluir = excluir;

    function zerar(){
      if(confirm("Apagar todos os gastos?")){
        localStorage.removeItem(KEY);
        render();
      }
    }

    function exportarCSV(){
      const gastos = ler().sort(ordenarDesc);
      if(!gastos.length){ alert("Não há dados para exportar."); return; }
      const linhas = [["Data","Hora","Tipo","Observação","Valor"]];
      for(const g of gastos){
        linhas.push([g.data,g.hora,g.categoria,g.descricao || "", Number(g.valor).toFixed(2)]);
      }
      const csv = linhas.map(l => l.map(v => `"${String(v).replaceAll('"','""')}"`).join(";")).join("\n");
      const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "gastos.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById("btnAdd").addEventListener("click", adicionar);
    document.getElementById("btnClear").addEventListener("click", zerar);
    document.getElementById("btnExport").addEventListener("click", exportarCSV);
    valorEl.addEventListener("keydown", e => { if(e.key === "Enter") adicionar(); });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBox.style.display = "flex";
    });

    btnInstall.addEventListener("click", async () => {
      if (!deferredPrompt) {
        alert("O botão de instalar só aparece quando o app é aberto por um link HTTPS e o navegador permite instalação.");
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBox.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      installBox.style.display = "none";
    });

    render();
  </script>
</body>
</html>
